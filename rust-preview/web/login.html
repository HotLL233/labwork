<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · labwork</title><link rel="stylesheet" href="/app.css"><script src="/login.js" defer></script></head><body class="login-page"><main class="login-card"><a class="brand" href="/login"><span class="brand-mark" aria-hidden="true">L</span><strong>labwork</strong></a><h1>回到实验室工作台</h1><p>使用服务器访问密码登录。</p><form id="login-form" method="post" action="/api/login" autocomplete="on"><label for="username">登录名称<input id="username" name="username" value="labwork" autocomplete="username" readonly></label><label for="password">访问密码<input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256" autofocus></label><label class="remember-label"><input id="remember" name="remember" type="checkbox" checked>保持登录 30 天</label><button class="primary" id="login-submit" type="submit">登录工作台</button><p id="login-error" role="alert" hidden></p></form><small>可使用浏览器密码管理器保存密码；公用设备请取消保持登录。</small></main></body></html>
