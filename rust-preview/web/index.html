<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="labwork-token" content="__TOKEN__"><title>理化检测平台 · 表格录入</title><link rel="stylesheet" href="/app.css"><script src="/app.js" defer></script></head><body>
<header class="top"><div class="logo">▦</div><strong>理化检测平台</strong><span class="version">Rust 预览版</span><div class="top-right">工作簿副本 <span class="dot"></span><span>本机验证</span></div></header>
<div class="app"><aside class="sidebar"><div class="side-title">检测项目</div><div id="projects"></div><div class="side-foot">先选择项目，再选择检测方法<br>当前验证 D006 / Q</div></aside><main>
<div class="heading"><div><div class="breadcrumb" id="breadcrumb">检测项目 / D006</div><h1 id="title">请选择检测方法</h1></div><button id="history-button" class="quiet">预览与写入历史</button></div>
<nav class="methods" id="methods" aria-label="检测方法"></nav>
<div class="ribbon"><div><span class="ribbon-tab active">检测录入</span><span class="ribbon-tab">原表预览</span><span class="ribbon-tab">计算结果</span></div><div class="ribbon-actions"><button id="calculate" class="primary">计算并预览写入</button><button id="commit" disabled>确认写入工作副本</button><a id="download" class="button" hidden>下载预览 Excel</a><button id="reset" class="quiet">清空本次输入</button></div></div>
<div class="notice" role="status">本页使用独立工作簿副本。计算预览不写入文件；确认写入后追加新行并备份。方法参数仍需业务核定。</div>
<section class="metadata"><label>检测日期<input id="date" type="date" required></label><label>样品批号<input id="batch" placeholder="例如：D006-20261009-01" maxlength="100" required></label><label class="notes">备注<input id="notes" placeholder="可填写样品或检测说明" maxlength="2000"></label><button id="parallel" class="quiet">＋ 第二次平行测定</button></section>
<section class="editor"><div class="editor-title"><strong>原始数据录入</strong><span>浅黄色单元格可编辑 · Tab / Enter 切换 · 支持从 Excel 粘贴</span><button id="sample" class="quiet">填入验证示例</button></div><div id="entry" class="entry-scroll"></div><div id="mobile-entry" class="mobile-entry"></div></section>
<div id="message" role="alert" hidden></div>
<section class="results" id="results" hidden></section>
<section class="sheet-panel"><div class="formula-bar"><span id="cell-address">A1</span><span class="fx">fx</span><input id="formula-value" aria-label="所选单元格内容或公式" readonly placeholder="点击下方单元格，查看原始内容和公式"><button id="mobile-preview" class="quiet">原表视图</button></div><div class="sheet-toolbar"><span id="sheet-label">原表布局预览</span><span class="muted" id="sheet-note">保留列宽、行高、合并和样式</span></div><div class="sheet-scroll" id="sheet-scroll"><table id="sheet" aria-label="Excel工作表预览"></table></div><div class="sheet-tabs"><span class="sheet-nav">◂ ▸</span><div id="sheet-tabs"></div><span class="sheet-status" id="sheet-status">就绪</span></div></section>
<section id="history" hidden></section><footer><span id="parameters"></span><span>Rust + SQLite · 0.0.2-alpha.1 · 预览与写入状态分别显示</span></footer>
</main></div></body></html>
