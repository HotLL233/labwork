name: labwork
services:
  db:
    image: labwork-postgres:17.11
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先运行初始化配置}
      LABWORK_DB_PASSWORD: ${LABWORK_DB_PASSWORD:?请先运行初始化配置}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [internal]
  initialize:
    image: labwork:0.0.1
    command: [python, runtime.py, initialize]
    volumes:
      - runtime:/runtime
    depends_on:
      db: {condition: service_healthy}
    networks: [internal]
  web:
    image: labwork:0.0.1
    restart: unless-stopped
    volumes:
      - runtime:/runtime
    depends_on:
      initialize: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18801/health/')"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
  worker:
    image: labwork:0.0.1
    command: [python, runtime.py, worker]
    restart: unless-stopped
    volumes:
      - runtime:/runtime
    depends_on:
      initialize: {condition: service_completed_successfully}
    networks: [internal]
  gateway:
    image: labwork-gateway:0.0.1
    restart: unless-stopped
    environment:
      LABWORK_HOST: ${LABWORK_HOST:?请先运行初始化配置}
    ports: ["${BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-8443}:443"]
    volumes:
      - certificates:/data
      - caddy_config:/config
    depends_on:
      web: {condition: service_healthy}
    networks:
      internal: {ipv4_address: "${PROXY_IP:-172.30.86.10}"}
networks:
  internal:
    ipam:
      config: [{subnet: "${DOCKER_SUBNET:-172.30.86.0/24}"}]
volumes:
  database:
  runtime:
    name: "${RUNTIME_VOLUME:-labwork_runtime}"
  certificates:
  caddy_config:
